name: Build Android APK

# [Perubahan] Sebelumnya workflow ini juga terpicu otomatis lewat `push` dan
# `pull_request` ke branch main. Sekarang HANYA bisa dijalankan manual lewat
# tab Actions -> "Build Android APK" -> "Run workflow" (workflow_dispatch).
# Alasan lazim untuk ini: menghemat kuota menit CI, atau menghindari build
# APK debug otomatis di setiap commit/PR selama masih tahap audit/perbaikan
# aktif. Kembalikan blok `push:`/`pull_request:` di bawah kalau nanti mau
# balik ke trigger otomatis.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Bootstrap version must match gradle-wrapper.properties. It is required because
          # the repository previously omitted gradle-wrapper.jar.
          gradle-version: '9.3.1'

      - name: Prepare Environment and Wrapper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Copy .env.example to .env if .env does not exist
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Append the CI secret last so java.util.Properties uses it over the example value.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '\nGEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          fi

          # Regenerate an incomplete wrapper (the repository previously omitted its JAR).
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-unit-test-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          retention-days: 14
          if-no-files-found: warn

      - name: Build Debug APK
        if: ${{ success() && (env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both') }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ success() && (env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both') }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Release APK
        if: ${{ success() && (env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both') }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        if: ${{ success() && (env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both') }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
