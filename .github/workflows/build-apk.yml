name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Bootstrap version must match gradle-wrapper.properties. It is required because
          # the repository previously omitted gradle-wrapper.jar.
          gradle-version: '9.3.1'

      - name: Prepare Environment and Keystore
        run: |
          # Copy .env.example to .env if .env does not exist
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # If GEMINI_API_KEY secret exists in repo, append or replace
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

          # Decode debug keystore if base64 file exists, or generate fallback debug keystore
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              (base64 -d debug.keystore.base64 > debug.keystore) || (base64 -D debug.keystore.base64 > debug.keystore) || true
            fi
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Regenerate an incomplete wrapper (the repository previously omitted its JAR).
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-unit-test-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          retention-days: 14
          if-no-files-found: warn

      - name: Build Debug APK
        if: ${{ success() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '') }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ success() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '') }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Release APK
        if: ${{ success() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        if: ${{ success() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v7
        with:
          name: dokupdf-app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
